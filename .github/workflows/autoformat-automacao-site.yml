name: Autoformat automacao-site

on:
  push:
    branches:
      - automacao-site

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Autoformata branch automacao-site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automacao-site
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run check:fix

      - name: Commitar apenas se houver correcoes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'Penkal Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit --no-verify -m 'Autoformata branch automacao-site'
          git push origin HEAD:automacao-site
