name: Automation sales metadata patch

on:
  push:
    branches:
      - automacao-site

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automacao-site
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Aplicar patch deterministico
        run: |
          python - <<'PY'
          from pathlib import Path

          parser = Path('src/app/(main)/importar-dados/_lib/parse-sales-xlsx.ts')
          text = parser.read_text()

          marker = 'export function parseSalesExportedAt(fileName: string): string | null {'
          helper = r'''export function parseSalesReportExportedAt(buffer: Buffer): string | null {
            const workbook = read(buffer, { type: "buffer", cellDates: true, sheetRows: 6 });
            for (const name of workbook.SheetNames) {
              const rows = utils.sheet_to_json<CellValue[]>(workbook.Sheets[name], { header: 1, raw: true, defval: null });
              for (const row of rows) {
                for (const entry of row) {
                  const text = cellText(entry);
                  if (!/status das suas vendas/i.test(text)) continue;
                  const match = text.match(
                    /em\s+(\d{1,2})\s+de\s+([\p{L}]+)\s+de\s+(\d{4}),?\s+(?:às|as)\s+(\d{1,2}):(\d{2})\s+hs?/iu,
                  );
                  if (!match) continue;
                  const [, day, month, year, hour, minute] = match;
                  const parsed = parseBrazilianDate(`${day} de ${month} de ${year} ${hour}:${minute} hs.`);
                  if (parsed) return parsed;
                }
              }
            }
            return null;
          }

          '''
          if 'export function parseSalesReportExportedAt' not in text:
              assert marker in text
              text = text.replace(marker, helper + marker, 1)

          marker2 = 'function localDateTimeToIso(\n'
          business = r'''export function saleBusinessDate(value: string): string | null {
            if (!value) return null;
            try {
              return Temporal.Instant.from(value).toZonedDateTimeISO(SALES_TIME_ZONE).toPlainDate().toString();
            } catch {
              return null;
            }
          }

          '''
          if 'export function saleBusinessDate' not in text:
              assert marker2 in text
              text = text.replace(marker2, business + marker2, 1)

          old = '''  const validDates = rows
            .map((row) => row.saleDate.slice(0, 10))
            .filter(Boolean)
            .sort();'''
          new = '''  const validDates = rows
            .map((row) => saleBusinessDate(row.saleDate))
            .filter((value): value is string => Boolean(value))
            .sort();'''
          if old in text:
              text = text.replace(old, new, 1)
          else:
              assert 'saleBusinessDate(row.saleDate)' in text
          parser.write_text(text)

          importer = Path('src/app/(main)/importar-dados/_lib/import-sales.ts')
          text = importer.read_text()
          old_import = 'import { type ParsedSaleRow, parseSalesExportedAt, parseSalesXlsx } from "./parse-sales-xlsx";'
          new_import = '''import {
            type ParsedSaleRow,
            parseSalesExportedAt,
            parseSalesReportExportedAt,
            parseSalesXlsx,
          } from "./parse-sales-xlsx";'''
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          else:
              assert 'parseSalesReportExportedAt' in text

          text = text.replace('"filename" | "unknown"', '"filename" | "report_header" | "unknown"')
          old_block = '''    const sourceExportedAt = parseSalesExportedAt(file.fileName);
            const sourceExportedAtSource = sourceExportedAt ? "filename" : "unknown";'''
          new_block = '''    const fileNameExportedAt = parseSalesExportedAt(file.fileName);
            const reportExportedAt = fileNameExportedAt ? null : parseSalesReportExportedAt(file.buffer);
            const sourceExportedAt = fileNameExportedAt ?? reportExportedAt;
            const sourceExportedAtSource = fileNameExportedAt
              ? "filename"
              : reportExportedAt
                ? "report_header"
                : "unknown";'''
          if old_block in text:
              text = text.replace(old_block, new_block, 1)
          else:
              assert 'reportExportedAt' in text
          importer.write_text(text)

          types = Path('src/app/(main)/importar-dados/_lib/sales-import-types.ts')
          text = types.read_text().replace('"filename" | "unknown"', '"filename" | "report_header" | "unknown"')
          types.write_text(text)

          migration = Path('supabase/migrations/20260816140000_permite_metadados_cabecalho_vendas.sql')
          if not migration.exists():
              migration.write_text('''alter table public.imports\n  drop constraint imports_source_exported_at_source_valid;\n\nalter table public.imports\n  add constraint imports_source_exported_at_source_valid check (\n    source_exported_at_source in (\n      'filename',\n      'report_header',\n      'user_confirmed',\n      'unknown'\n    )\n  );\n''')
          PY

      - name: Instalar dependencias
        run: npm ci

      - name: Validar
        run: |
          npm run validate:sales-history-import
          npm run check
          npx tsc --noEmit
          git diff --check

      - name: Commitar patch
        run: |
          if git diff --quiet; then
            echo 'Sem alteracoes.'
            exit 0
          fi
          git config user.name 'Penkal Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add 'src/app/(main)/importar-dados/_lib/parse-sales-xlsx.ts' \
                  'src/app/(main)/importar-dados/_lib/import-sales.ts' \
                  'src/app/(main)/importar-dados/_lib/sales-import-types.ts' \
                  'supabase/migrations/20260816140000_permite_metadados_cabecalho_vendas.sql'
          git commit -m 'Automacao: corrige metadados historicos de vendas'
          git push origin HEAD:automacao-site
