name: Hotfix parser vendas

on:
  push:
    branches:
      - automacao-site

permissions:
  contents: write

jobs:
  fix-parser:
    if: github.event.head_commit.message == 'Aplica hotfix parser vendas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automacao-site
          fetch-depth: 0

      - name: Corrigir validacao financeira de resumos de pacote
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/(main)/importar-dados/_lib/parse-sales-xlsx.ts')
          text = path.read_text(encoding='utf-8')
          old = '''    if (\n      explicitGross === null &&\n      productRevenue === null &&\n      netAmount === null &&\n      !activePackage &&\n      unitPrice === null\n    ) {\n      problems.push({ line, message: "Linha sem valor financeiro para Receita bruta" });\n    }'''
          new = '''    if (\n      type === "sale_item" &&\n      explicitGross === null &&\n      productRevenue === null &&\n      netAmount === null &&\n      !activePackage &&\n      unitPrice === null\n    ) {\n      problems.push({ line, message: "Linha sem valor financeiro para Receita bruta" });\n    }'''
          if old not in text:
              raise SystemExit('Trecho esperado nao encontrado; hotfix nao aplicado.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commitar hotfix
        run: |
          git config user.name 'Penkal Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add 'src/app/(main)/importar-dados/_lib/parse-sales-xlsx.ts'
          git commit -m 'Corrige validacao financeira de resumos de pacote'
          git push origin HEAD:automacao-site
