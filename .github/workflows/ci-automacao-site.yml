name: CI automacao-site

on:
  push:
    branches:
      - automacao-site

permissions:
  contents: read

# Valida o estado atual da branch depois das correções automáticas de estilo.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Biome
        run: npm run check

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Historico de vendas
        run: npm run validate:sales-history-import
