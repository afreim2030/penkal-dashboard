name: CI automacao-site

on:
  push:
    branches:
      - automacao-site

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Biome
        run: npm run check

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Valida importador de anuncios
        run: npm run validate:importer

      - name: Valida importador de vendas
        run: npm run validate:sales-importer

      - name: Valida historico de vendas
        run: npm run validate:sales-history-import

      - name: Valida importador FULL
        run: |
          if [[ -f "FULL(1).xlsx" ]]; then
            npm run validate:full-importer
          else
            echo "Fixture privado FULL(1).xlsx ausente no runner; validação real mantida para ambiente local."
          fi

      - name: Valida envios FULL
        run: |
          if [[ -d "arquivos-envios-full" ]]; then
            npm run validate:inbounds-importer
          else
            echo "Fixtures privados de envios FULL ausentes no runner; validação real mantida para ambiente local."
          fi

      - name: Valida FIFO FULL
        run: |
          if [[ -f "FULL(1).xlsx" && -d "arquivos-envios-full" ]]; then
            npm run validate:full-fifo
          else
            echo "Fixtures privados de estoque/envios ausentes no runner; validação FIFO real mantida para ambiente local."
          fi

      - name: Valida giro de estoque
        run: npm run validate:stock-velocity

      - name: Valida prioridade de estoque
        run: |
          SALES_FIXTURE="20260811_Vendas_BR_Mercado_Livre_y_Mercado_Shops_2026-08-11_14-43hs_1102986048(1).xlsx"
          if [[ -f "FULL(1).xlsx" && -f "$SALES_FIXTURE" && -d "arquivos-envios-full" ]]; then
            npm run validate:stock-priority
          else
            echo "Fixtures privados de estoque/vendas/envios ausentes no runner; auditoria real de prioridade mantida para ambiente local."
          fi

      - name: Build Next.js
        run: npm run build
