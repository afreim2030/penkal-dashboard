name: CI automacao-site

on:
  push:
    branches:
      - automacao-site

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Biome
        run: npm run check

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Valida importador de anuncios
        run: npm run validate:importer

      - name: Valida importador de vendas
        run: npm run validate:sales-importer

      - name: Valida historico de vendas
        run: npm run validate:sales-history-import

      - name: Valida importador FULL
        run: npm run validate:full-importer

      - name: Valida envios FULL
        run: npm run validate:inbounds-importer

      - name: Valida FIFO FULL
        run: npm run validate:full-fifo

      - name: Valida giro de estoque
        run: npm run validate:stock-velocity

      - name: Valida prioridade de estoque
        run: npm run validate:stock-priority

      - name: Build Next.js
        run: npm run build
